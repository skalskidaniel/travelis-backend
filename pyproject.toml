[project]
name = "travelis-backend"
version = "0.1.0"
description = "Backend service for wakacje-travelis.pl"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "fastapi[standard]>=0.137.0",
    "httpx>=0.28.1",
    "httpx2>=2.4.0",
    "mangum>=0.21.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.8.0",
    "pywebpush>=2.3.0",
    "redis[hiredis]>=8.0.0",
    "types-aioboto3[dynamodb]>=15.5.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-rf"
markers = [
    "provider_integration: marks test as a provider integration test",
    "repo_integration: marks test as a repo integration test",
]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.36.2",
    "ipykernel>=7.3.0",
    "moto[dynamodb]>=5.2.2",
    "playwright>=1.60.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.15.17",
]
